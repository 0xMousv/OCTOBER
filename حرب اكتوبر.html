<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حرب اكتوبر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#fcfdff;--ink:#0d0d0d;--accent:#c4161c;--gold:#c9a227;--gold-soft:#d9bf62;--line:#ecdca0;--muted:#8a7f66;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--ink);font-family:"Cairo",Tahoma,sans-serif}
/* hero */
.top{position:relative;height:100vh;height:100svh;overflow:hidden;background:var(--bg)}
.art{position:absolute;left:0;right:0;bottom:0;height:min(100%,max(55vw,60%));overflow:hidden;transform-origin:60% 100%;animation:breathe 10s ease-in-out infinite alternate}
.art img{width:100%;height:100%;object-fit:cover;object-position:55% 100%;display:block;transform:scale(1.14);transform-origin:62% 85%;transition:transform 5s cubic-bezier(.2,.7,.2,1)}
.on .art img{transform:scale(1)}
@keyframes breathe{to{transform:scale(1.012)}}
.hero{position:absolute;left:45%;top:7%;transform:translateX(-50%);width:min(94vw,760px);text-align:center;pointer-events:none}
.on .hero{pointer-events:auto}
.ttl{font-family:"Lalezar","Cairo",sans-serif;font-weight:400;font-size:clamp(46px,5.6vw,100px);line-height:1.15;margin:0;opacity:0}
.on .ttl{opacity:1;animation:titleIn 1.4s .25s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes titleIn{from{opacity:0;transform:scale(1.35);filter:blur(14px)}}
.nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:clamp(12px,1.6vw,26px)}
.nav button{font-family:"Lalezar","Cairo",sans-serif;font-size:clamp(15px,1.55vw,24px);color:var(--ink);background:rgba(255,255,255,.6);border:2px solid var(--ink);border-radius:24px;padding:.35em 1.1em;cursor:pointer;opacity:0;transition:transform .2s,background .2s,color .2s}
.on .nav button{opacity:1;animation:btnIn .6s calc(1.05s + var(--n)*.16s) cubic-bezier(.2,.9,.3,1.3) backwards}
@keyframes btnIn{from{opacity:0;transform:translateY(20px) scale(.8)}}
.nav button:hover,.nav button:focus-visible{transform:translateY(-3px);background:var(--accent);border-color:var(--accent);color:#fff;outline:none}
/* sections */
.band{border-top:1px solid var(--line);padding:clamp(56px,9vw,100px) 20px;background:#fff}
.in{max-width:780px;margin:0 auto}
.stt{font-family:"Lalezar","Cairo",sans-serif;font-weight:400;font-size:clamp(34px,6vw,56px);text-align:center;margin:0;line-height:1.2}
.stt::after{content:"";display:block;width:90px;height:4px;margin:10px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s var(--dl,0s),transform .7s var(--dl,0s)}
.rv.in{opacity:1;transform:none}
.flow{display:flex;flex-direction:column;align-items:center;margin-top:36px}
.card{width:100%;max-width:600px;box-sizing:border-box;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:14px 20px;box-shadow:0 8px 24px rgba(201,162,39,.12)}
.lbl{font-family:"Lalezar","Cairo",sans-serif;color:var(--accent);font-size:clamp(20px,4.4vw,26px);display:flex;align-items:center;gap:10px}
.num{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#fff;font-size:17px}
.card p{margin:4px 0 0;line-height:1.9;font-size:clamp(15px,3.4vw,17px)}
.ar{height:56px}
.ar svg{width:28px;height:52px;stroke:var(--gold-soft);stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ar line{stroke-dasharray:38;stroke-dashoffset:38;transition:stroke-dashoffset .5s calc(var(--dl,0s) + .1s)}
.ar .hd{opacity:0;transition:opacity .3s calc(var(--dl,0s) + .5s)}
.ar.in line{stroke-dashoffset:0}
.ar.in .hd{opacity:1}
.ar.in svg{animation:nudge 1.3s 1.3s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(5px)}}
/* people boxes */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:36px}
.pc{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:18px;text-align:center;box-shadow:0 8px 24px rgba(201,162,39,.12)}
.pc.rv{transform:translateY(34px) scale(.92);transition:opacity .7s var(--dl,0s),transform .7s var(--dl,0s),box-shadow .3s,border-color .3s}
.pc.rv.in{transform:none}
.pc:hover{transform:translateY(-6px);border-color:var(--gold);box-shadow:0 14px 34px rgba(201,162,39,.28)}
.av{width:64px;height:64px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-family:"Lalezar","Cairo",sans-serif;font-size:30px;color:#fff;background:radial-gradient(circle at 30% 30%,#ecd57c,var(--gold));box-shadow:0 0 0 5px rgba(217,191,98,.25)}
.pc h3{font-family:"Lalezar","Cairo",sans-serif;font-weight:400;font-size:26px;margin:0}
.role{color:var(--accent);font-weight:700;font-size:14px;margin:2px 0 10px}
.works{border-top:1px dashed var(--line);padding-top:10px;text-align:right;line-height:1.9;font-size:15px;min-height:64px}
.works.empty{color:var(--muted)}
.up{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:1.5px solid var(--gold);background:#fff;color:var(--gold);font-size:20px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9}
.up.show{opacity:1;pointer-events:auto}
@media (max-width:700px){.hero{left:50%;top:6%}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.ttl,.nav button,.rv,.ar .hd{opacity:1!important;animation:none!important;transform:none!important;filter:none!important;transition:none!important}.ar line{stroke-dashoffset:0!important;transition:none!important}.ar svg{animation:none!important}.art,.art img{animation:none;transform:none;transition:none}}
</style>
</head>

  <div class="hero">
    <h1 class="ttl">حرب اكتوبر</h1>
    <nav class="nav" aria-label="أقسام الموقع">
      <button data-k="events" style="--n:0">أهم الأحداث</button>
      <button data-k="people" style="--n:1">أهم الشخصيات</button>
      <button data-k="plan" style="--n:2">خطة النجاح</button>
    </nav>

</header>

<main>
  <section class="band" id="events"><div class="in"><h2 class="stt rv obs">أهم الأحداث</h2><div class="flow" id="flowEvents"></div></div></section>
  <section class="band" id="people"><div class="in"><h2 class="stt rv obs">أهم الشخصيات</h2><div class="grid" id="grid"></div></div></section>
  <section class="band" id="plan"><div class="in"><h2 class="stt rv obs">خطة النجاح</h2><div class="flow" id="flowPlan"></div></div></section>
</main>
<button class="up" id="up" aria-label="للأعلى">↑</button>

<script>
// ===== المحتوى: عدّل النصوص من هنا =====
const EVENTS=[
 ["٦ أكتوبر ١٩٧٣ · ٢:٠٥ ظهرًا","الضربة الجوية الأولى وقصف مدفعي مركز، وبدء عبور القناة."],
 ["٦ – ٧ أكتوبر","عبور موجات المشاة واقتحام الساتر الترابي لخط بارليف، وفتح ثغرات بخراطيم المياه، وإقامة الكباري لعبور المدرعات."],
 ["في نفس اليوم · الجبهة السورية","هجوم سوري متزامن في الجولان."],
 ["١٤ أكتوبر","معركة المدرعات الكبرى في سيناء، من أكبر معارك الدبابات منذ الحرب العالمية الثانية."],
 ["١٦ أكتوبر","عبور قوات إسرائيلية إلى الضفة الغربية للقناة في منطقة الدفرسوار."],
 ["٢٢ أكتوبر","مجلس الأمن يصدر القرار ٣٣٨ بوقف إطلاق النار، وتتوقف المعارك فعليًا في أواخر الشهر."]];
const PLAN=[
 ["الخداع الاستراتيجي","مناورات متكررة وإجراءات تمويه جعلت العدو يعتاد على التحركات حتى لا يصدق أنها حرب حقيقية."],
 ["الضربة الجوية الأولى","أكثر من ٢٠٠ طائرة عبرت القناة في دقائق وضربت المطارات ومراكز القيادة والمدفعية."],
 ["خراطيم المياه","مضخات مياه عالية الضغط فتحت ثغرات في الساتر الترابي لخط بارليف بدل الاعتماد على المتفجرات وحدها."],
 ["العبور بالقوارب والكباري","عبرت موجات المشاة بالقوارب المطاطية وتسلقت الساتر، بينما أُقيمت الكباري لعبور المدرعات."],
 ["الصواريخ المضادة للدبابات","أفراد المشاة حملوا صواريخ مضادة للدروع لصد هجمات الدبابات المضادة."],
 ["مظلة الدفاع الجوي","شبكة صواريخ أرض-جو حدّت من تفوق سلاح الجو المعادي فوق منطقة القناة."]];
// اكتب أعمال كل شخصية في خانة works
const PEOPLE=[
 {name:"أنور السادات",role:"رئيس الجمهورية والقائد الأعلى",works:""},
 {name:"أحمد إسماعيل علي",role:"وزير الحربية والقائد العام",works:""},
 {name:"سعد الدين الشاذلي",role:"رئيس أركان حرب القوات المسلحة",works:""},
 {name:"محمد عبد الغني الجمسي",role:"رئيس هيئة العمليات",works:""},
 {name:"حسني مبارك",role:"قائد القوات الجوية",works:""},
 {name:"محمد علي فهمي",role:"قائد قوات الدفاع الجوي",works:""},
 {name:"الجندي المصري",role:"البطل الحقيقي للعبور",works:""}];
// ===== البناء =====
const ar=n=>n.toLocaleString('ar-EG');
const ARROW='<div class="ar obs"><svg viewBox="0 0 28 52" aria-hidden="true"><line x1="14" y1="2" x2="14" y2="40"/><path class="hd" d="M6 30L14 42L22 30"/></svg></div>';
function flow(id,items,numbered){
  document.getElementById(id).innerHTML=items.map((e,i)=>
    `<div class="card rv obs"><div class="lbl">${numbered?`<span class="num">${ar(i+1)}</span>`:''}${e[0]}</div><p>${e[1]}</p></div>`+(i<items.length-1?ARROW:'')).join('');
}
flow('flowEvents',EVENTS,false);flow('flowPlan',PLAN,true);
document.getElementById('grid').innerHTML=PEOPLE.map((p,i)=>
  `<div class="pc rv obs"><div class="av">${ar(i+1)}</div><h3>${p.name}</h3><div class="role">${p.role}</div><div class="works${p.works?'':' empty'}">${p.works||'هنا تُكتب أعماله…'}</div></div>`).join('');
// ظهور تدريجي أثناء النزول
const io=new IntersectionObserver(es=>{
  es.filter(e=>e.isIntersecting).sort((a,b)=>a.target.compareDocumentPosition(b.target)&4?-1:1).forEach((e,k)=>{
    const el=e.target;el.style.setProperty('--dl',(k*.35)+'s');el.classList.add('in');io.unobserve(el);
    setTimeout(()=>el.style.setProperty('--dl','0s'),2400+k*350);
  });
},{threshold:.25,rootMargin:'0px 0px -8% 0px'});
document.querySelectorAll('.obs').forEach(el=>io.observe(el));
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.k).scrollIntoView({behavior:'smooth',block:'start'}));
const up=document.getElementById('up');
up.onclick=()=>scrollTo({top:0,behavior:'smooth'});
addEventListener('scroll',()=>up.classList.toggle('show',scrollY>500),{passive:true});
requestAnimationFrame(()=>setTimeout(()=>document.body.classList.add('on'),150));
</script>
</body>
</html>
